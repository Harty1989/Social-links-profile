<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <title>Frontend Mentor | Social links profile</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
    rel="stylesheet">
</head>

<body>
  <main>
    <div class="container">
      <img src="assets/images/avatar-jessica.jpeg" alt="avatar">
      <h1>Jessica Randall</h1>
      <p class="location">London, United Kingdom</p>
      <p class="description">"Front-end developer and avid reader."</p>

      <div class="buttons">GitHub</div>
      <div class="buttons">Frontend Mentor</div>
      <div class="buttons">LinkedIn</div>
      <div class="buttons">Twitter</div>
      <div class="buttons">Instagram</div>
    </div>
  </main>
  <footer>
    <div class="attribution">
      <p>Challenge by:</p> <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>
      <p>Coded by</p> <a href="#">Dule.</a>
    </div>
  </footer>
</body>

</html>
